name: Deploy Cadence to EdgeOne Pages

on:
  workflow_dispatch:
    inputs:
      edgeone_project_name:
        description: Exact existing EdgeOne Pages project name (not the domain)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cadence-edgeone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static site to existing EdgeOne project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Cadence
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare static deployment directory
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icons/icon.svg
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('.well-known/assetlinks.json','utf8'));"
          mkdir -p dist/icons dist/.well-known
          cp index.html manifest.webmanifest sw.js dist/
          cp icons/icon.svg dist/icons/
          cp .well-known/assetlinks.json dist/.well-known/

      - name: Validate deployment inputs
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ inputs.edgeone_project_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDGEONE_API_TOKEN" || { echo "::error::Add EDGEONE_API_TOKEN in Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$EDGEONE_PROJECT_NAME" || { echo "::error::Enter the exact existing EdgeOne Pages project name."; exit 1; }
          echo "Will deploy static files to the EdgeOne Pages project named: $EDGEONE_PROJECT_NAME"
          echo "Do not enter a domain name here. Use the project name shown in the EdgeOne console."

      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ inputs.edgeone_project_name }}
        run: npx --yes edgeone@latest pages deploy ./dist -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production
