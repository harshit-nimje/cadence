name: Validate Cadence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadence-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app and PWA files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required files
        run: |
          set -euo pipefail
          for f in index.html app.css core.js extras.js sw.js stamp.js manifest.webmanifest twa-manifest.json tests/cadence.test.js .well-known/assetlinks.json icons/icon.svg icons/icon-96.png icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/maskable-512.png; do
            test -s "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done

      - name: Validate JSON manifests, icons and signing links
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const twa = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          const links = JSON.parse(fs.readFileSync('.well-known/assetlinks.json', 'utf8'));
          if (!manifest.name || manifest.display !== 'standalone') throw new Error('PWA manifest missing required name/display');
          for (const size of ['192x192', '512x512']) if (!manifest.icons?.some(icon => icon.sizes === size)) throw new Error('PWA manifest missing ' + size + ' icon');
          const pngSize = path => {
            const b = fs.readFileSync(path);
            if (b.length < 24 || b.toString('hex', 0, 8) !== '89504e470d0a1a0a') throw new Error(path + ' is not a valid PNG');
            return [b.readUInt32BE(16), b.readUInt32BE(20)];
          };
          for (const [path, size] of Object.entries({
            'icons/icon-96.png': [96, 96],
            'icons/apple-touch-icon.png': [180, 180],
            'icons/icon-192.png': [192, 192],
            'icons/icon-512.png': [512, 512],
            'icons/maskable-512.png': [512, 512]
          })) if (JSON.stringify(pngSize(path)) !== JSON.stringify(size)) throw new Error(path + ' has incorrect dimensions');
          for (const icon of manifest.icons ?? []) {
            const src = icon.src.split('?')[0].replace(/^\//, '');
            if (!fs.existsSync(src)) throw new Error('Manifest references missing icon: ' + icon.src);
          }
          if (!manifest.icons?.some(icon => icon.src === 'icons/maskable-512.png' && icon.purpose === 'maskable')) throw new Error('Manifest missing maskable icon');
          if (twa.appVersion !== '1.1.0' || twa.appVersionCode !== 3) throw new Error('TWA version must be 1.1.0 / code 3');
          if (!Array.isArray(links) || !links.some(link => link.target?.package_name === twa.packageId && link.relation?.includes('delegate_permission/common.handle_all_urls') && twa.fingerprints?.some(f => link.target?.sha256_cert_fingerprints?.includes(f.value)))) throw new Error('Digital Asset Links do not match the TWA package and signing fingerprint');
          console.log('PWA manifest, icons, TWA version and Digital Asset Links are valid.');
          NODE

      - name: Check HTML entry points and JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/rel=["']manifest["']/.test(html)) throw new Error('HTML does not link the web manifest');
          if (!html.includes('content="1.1.0"')) throw new Error('HTML release marker is not 1.1.0');
          for (const src of ['app.css', 'core.js', 'extras.js']) {
            if (!html.includes(src)) throw new Error('HTML does not reference ' + src);
          }
          if (!fs.readFileSync('extras.js', 'utf8').includes('navigator.serviceWorker.register')) throw new Error('Service-worker registration missing from extras.js');
          console.log('HTML entry points and service-worker bootstrap are present.');
          NODE
          node --check core.js
          node --check extras.js
          node --check sw.js

      - name: Run regression tests
        run: node --test tests/cadence.test.js
