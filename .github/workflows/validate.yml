name: Validate Cadence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadence-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app and PWA files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s twa-manifest.json
          test -s icons/icon.svg
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s .well-known/assetlinks.json
          test -s .github/workflows/android.yml
          test -s .github/workflows/deploy-edgeone.yml

      - name: Validate JSON manifests
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const twa = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          const links = JSON.parse(fs.readFileSync('.well-known/assetlinks.json', 'utf8'));
          if (!manifest.name || manifest.display !== 'standalone') throw new Error('PWA manifest missing required name/display');
          if (!manifest.icons?.some(icon => icon.sizes === '192x192')) throw new Error('PWA manifest missing 192x192 icon');
          if (!manifest.icons?.some(icon => icon.sizes === '512x512')) throw new Error('PWA manifest missing 512x512 icon');
          if (!twa.packageId || !twa.host || !twa.appVersion || !Number.isInteger(twa.appVersionCode)) throw new Error('TWA manifest missing package/version/host');
          if (!Number.isInteger(twa.minSdkVersion) || twa.minSdkVersion < 24) throw new Error('TWA minimum SDK must be 24 or newer for Android Browser Helper 2.7.4');
          if (!Array.isArray(links)) throw new Error('Digital Asset Links file must be a JSON array');
          console.log('PWA manifest, TWA manifest, and both required raster icon sizes parsed successfully.');
          const expected = twa.fingerprints?.map(f => f.value) ?? [];
          if (!links.some(link => link.target?.package_name === twa.packageId && link.relation?.includes('delegate_permission/common.handle_all_urls') && expected.some(fp => link.target?.sha256_cert_fingerprints?.includes(fp)))) {
            throw new Error('Digital Asset Links does not contain the TWA package and configured signing fingerprint');
          }
          console.log('Digital Asset Links package and signing fingerprint match twa-manifest.json.');
          NODE

      - name: Verify PWA bootstrap
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'rel="manifest"' index.html
          grep -Fq 'navigator.serviceWorker.register' index.html
          grep -Fq '/sw.js' index.html
          grep -Fq 'Cadence' index.html
          echo "PWA manifest and service-worker bootstrap are present."
