name: Build Android (TWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadence-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate repository files
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.css
          test -s core.js
          test -s extras.js
          test -s tests/cadence.test.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s twa-manifest.json
          test -s icons/icon.svg
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); const t=JSON.parse(fs.readFileSync('twa-manifest.json','utf8')); const a=JSON.parse(fs.readFileSync('.well-known/assetlinks.json','utf8')); if(!m.icons.some(i=>i.sizes==='192x192') || !m.icons.some(i=>i.sizes==='512x512')) throw Error('Manifest requires 192x192 and 512x512 icons'); if(!Array.isArray(a) || !a.some(x=>x.target?.package_name===t.packageId && x.relation?.includes('delegate_permission/common.handle_all_urls') && t.fingerprints?.some(f=>x.target?.sha256_cert_fingerprints?.includes(f.value)))) throw Error('Digital Asset Links does not match TWA package/fingerprint');"

      - name: Configure Bubblewrap and Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set on this runner."; exit 1; }
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory does not exist: $SDK_ROOT"; exit 1; }

          # Bubblewrap expects the legacy tools/ or bin/ folder at the SDK root.
          # GitHub-hosted runners commonly provide cmdline-tools/latest instead.
          if [ ! -d "$SDK_ROOT/tools" ] && [ ! -d "$SDK_ROOT/bin" ]; then
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest"
            else
              CMDLINE_TOOLS="$(find "$SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -print 2>/dev/null | sort -V | tail -n 1)"
            fi
            test -n "$CMDLINE_TOOLS" || { echo "::error::Could not find Android command-line tools under $SDK_ROOT/cmdline-tools"; ls -la "$SDK_ROOT"; exit 1; }
            test -x "$CMDLINE_TOOLS/bin/sdkmanager" || { echo "::error::sdkmanager is missing from $CMDLINE_TOOLS/bin"; exit 1; }
            ln -s "$CMDLINE_TOOLS" "$SDK_ROOT/tools"
          fi

          test -d "$SDK_ROOT/tools" || test -d "$SDK_ROOT/bin" || { echo "::error::Bubblewrap cannot recognize SDK layout at $SDK_ROOT"; ls -la "$SDK_ROOT"; exit 1; }
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          npx --yes @bubblewrap/cli@1.27.0 updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK_ROOT"
          echo "Using Android SDK: $SDK_ROOT"
          ls -ld "$SDK_ROOT" "$SDK_ROOT/tools" 2>/dev/null || true

      - name: Run app regression and syntax tests
        run: |
          node --test tests/cadence.test.js
          node --check core.js
          node --check extras.js
          node --check sw.js

      - name: Verify deployed website
        shell: bash
        run: |
          set -euo pipefail
          # EdgeOne deploys from Git independently. Wait for it to publish this commit
          # instead of failing just because its production deployment is still running.
          deadline=$((SECONDS + 300))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/ -o /tmp/cadence-index.html 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/manifest.webmanifest -o /tmp/cadence-manifest.json 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/icons/icon.svg -o /tmp/cadence-icon.svg 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/icons/icon-192.png -o /tmp/cadence-icon-192.png 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/icons/icon-512.png -o /tmp/cadence-icon-512.png 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/sw.js -o /tmp/cadence-sw.js 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/app.css -o /tmp/cadence-app.css 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/core.js -o /tmp/cadence-core.js 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/extras.js -o /tmp/cadence-extras.js 2>/dev/null &&
               curl --fail --silent --show-error --location --connect-timeout 5 --max-time 8 https://cadence.edgeone.dev/.well-known/assetlinks.json -o /tmp/cadence-assetlinks.json 2>/dev/null &&
               grep -Fq 'rel="manifest"' /tmp/cadence-index.html &&
               grep -Fq 'content="1.1.0"' /tmp/cadence-index.html &&
               grep -Fq 'src="core.js"' /tmp/cadence-index.html &&
               grep -Fq 'src="extras.js"' /tmp/cadence-index.html &&
               grep -Fq 'navigator.serviceWorker.register' /tmp/cadence-extras.js &&
               node --check /tmp/cadence-core.js &&
               node --check /tmp/cadence-extras.js &&
               node - <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('/tmp/cadence-manifest.json', 'utf8'));
          const twa = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          const links = JSON.parse(fs.readFileSync('/tmp/cadence-assetlinks.json', 'utf8'));
          const pngSize = p => {
            const b = fs.readFileSync(p);
            if (b.length < 24 || b.toString('hex', 0, 8) !== '89504e470d0a1a0a') throw new Error(p + ' is not a PNG');
            return [b.readUInt32BE(16), b.readUInt32BE(20)];
          };
          if (!m.start_url || m.display !== 'standalone' || !Array.isArray(m.icons) || !m.icons.some(i => i.sizes === '192x192') || !m.icons.some(i => i.sizes === '512x512')) throw new Error('Live PWA manifest lacks start_url, standalone display or required raster icons');
          if (twa.appVersion !== '1.1.0' || twa.appVersionCode !== 3) throw new Error('TWA manifest is not configured for release 1.1.0 (version code 3)');
          if (JSON.stringify(pngSize('/tmp/cadence-icon-192.png')) !== '[192,192]') throw new Error('Live 192px icon has incorrect dimensions');
          if (JSON.stringify(pngSize('/tmp/cadence-icon-512.png')) !== '[512,512]') throw new Error('Live 512px icon has incorrect dimensions');
          if (!Array.isArray(links) || !links.some(x => x.target?.package_name === twa.packageId && x.relation?.includes('delegate_permission/common.handle_all_urls') && twa.fingerprints?.some(f => x.target?.sha256_cert_fingerprints?.includes(f.value)))) throw new Error('Live Digital Asset Links do not match the app package/signing fingerprint');
          console.log('Live homepage, PWA manifest, icon dimensions, service-worker bootstrap and Digital Asset Links are valid.');
          NODE
            then
              echo "Production website verification passed on attempt $attempt."
              exit 0
            fi
            echo "Production website has not finished deploying the required Android/PWA assets (attempt $attempt); retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Production website did not pass all checks within 5 minutes. Check the EdgeOne deployment for cadence.edgeone.dev."
          exit 1

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Add ANDROID_KEYSTORE_BASE64 to repository Actions secrets."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android.keystore
          chmod 600 android.keystore
          test -s android.keystore

      - name: Generate Android project from TWA manifest
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build signed APK and Play Store AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "::error::Add KEYSTORE_PASSWORD to repository Actions secrets."; exit 1; }
          test -n "$BUBBLEWRAP_KEY_PASSWORD" || { echo "::error::Add KEY_PASSWORD to repository Actions secrets."; exit 1; }
          ACTUAL_FINGERPRINT="$(keytool -list -v -keystore android.keystore -alias android -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" | awk -F ': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="$(node -e "const t=require('./twa-manifest.json');if(!t.fingerprints?.length)process.exit(1);process.stdout.write(t.fingerprints[0].value.replace(/:/g,'').toUpperCase())")"
          test -n "$ACTUAL_FINGERPRINT" || { echo "::error::Could not read SHA-256 fingerprint from the configured signing keystore."; exit 1; }
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || { echo "::error::Signing keystore fingerprint does not match twa-manifest.json. Confirm the GitHub secrets point to the same cadence-upload.jks key used to create the configured fingerprint."; exit 1; }
          echo "Signing keystore fingerprint matches TWA configuration."
          bubblewrap build --manifest=./twa-manifest.json --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Verify and collect packages
        run: |
          set -euo pipefail
          test -s app-release-signed.apk
          test -s app-release-bundle.aab
          mkdir -p release
          cp app-release-signed.apk release/
          cp app-release-bundle.aab release/
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: cadence-android
          path: release/*
          if-no-files-found: error
          retention-days: 30
